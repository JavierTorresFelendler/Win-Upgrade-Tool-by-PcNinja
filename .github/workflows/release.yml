name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run smoke tests
        shell: pwsh
        run: dotnet run --project tests/PcNinja.Win11Upgrade.SmokeTests/PcNinja.Win11Upgrade.SmokeTests.csproj -c Release

      - name: Publish portable EXE
        shell: pwsh
        run: >-
          dotnet publish
          src/PcNinja.Win11UpgradeAssistant/PcNinja.Win11UpgradeAssistant.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o artifacts

      - name: Prepare release assets
        shell: pwsh
        run: |
          Move-Item artifacts/PcNinja-Win11-Upgrade-Assistant.exe artifacts/PcNinja-Win11-Upgrade-Assistant-RC3.exe
          (Get-FileHash artifacts/PcNinja-Win11-Upgrade-Assistant-RC3.exe -Algorithm SHA256).Hash.ToLowerInvariant() + "  PcNinja-Win11-Upgrade-Assistant-RC3.exe" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Verify CLI entry points
        shell: pwsh
        run: |
          & artifacts/PcNinja-Win11-Upgrade-Assistant-RC3.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & artifacts/PcNinja-Win11-Upgrade-Assistant-RC3.exe status --json
          if ($LASTEXITCODE -notin 0,3) { exit $LASTEXITCODE }
          $help = & artifacts/PcNinja-Win11-Upgrade-Assistant-RC3.exe help upgrade
          if ($LASTEXITCODE -ne 0 -or $help -notmatch '--mounted') { exit 1 }
          $completion = & artifacts/PcNinja-Win11-Upgrade-Assistant-RC3.exe completion powershell | Out-String
          [scriptblock]::Create($completion) | Out-Null

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PcNinja-Win11-Upgrade-Assistant-RC3
          path: |
            artifacts/PcNinja-Win11-Upgrade-Assistant-RC3.exe
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            ## Documentation

            - [Graphical workflow and overview](https://github.com/${{ github.repository }}/blob/main/README.md)
            - [Complete CLI guide](https://github.com/${{ github.repository }}/blob/main/docs/CLI.md)

            Run `PcNinja-Win11-Upgrade-Assistant-RC3.exe help all` for the complete offline manual embedded in the downloaded EXE.

            Enable PowerShell Tab completion for the current session:

            ```powershell
            & .\PcNinja-Win11-Upgrade-Assistant-RC3.exe completion powershell | Out-String | Invoke-Expression
            ```
          files: |
            artifacts/PcNinja-Win11-Upgrade-Assistant-RC3.exe
            artifacts/SHA256SUMS.txt
