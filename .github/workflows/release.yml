name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run smoke tests
        shell: pwsh
        run: dotnet run --project tests/PcNinja.Win11Upgrade.SmokeTests/PcNinja.Win11Upgrade.SmokeTests.csproj -c Release

      - name: Run GUI action checks (never starts Setup)
        shell: pwsh
        run: |
          if ((Get-CimInstance Win32_OperatingSystem).ProductType -eq 1) {
            dotnet run --project tests/PcNinja.Win11Upgrade.GuiChecks/PcNinja.Win11Upgrade.GuiChecks.csproj -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Output 'GUI action checks require a supported Windows client; hosted Server runner skips these. Run them locally on Windows 10/11.'
          }

      - name: Publish portable EXE
        shell: pwsh
        run: >-
          dotnet publish
          src/PcNinja.Win11UpgradeAssistant/PcNinja.Win11UpgradeAssistant.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o artifacts

      - name: Prepare release assets
        shell: pwsh
        run: |
          Move-Item artifacts/PcNinja-Win11-Upgrade-Assistant.exe artifacts/PcNinja-Win11-Upgrade-Assistant-RC4.exe
          (Get-FileHash artifacts/PcNinja-Win11-Upgrade-Assistant-RC4.exe -Algorithm SHA256).Hash.ToLowerInvariant() + "  PcNinja-Win11-Upgrade-Assistant-RC4.exe" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Verify CLI entry points
        shell: pwsh
        run: |
          & artifacts/PcNinja-Win11-Upgrade-Assistant-RC4.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & artifacts/PcNinja-Win11-Upgrade-Assistant-RC4.exe status --json
          if ($LASTEXITCODE -notin 0,3) { exit $LASTEXITCODE }
          $help = & artifacts/PcNinja-Win11-Upgrade-Assistant-RC4.exe help upgrade | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch '--mounted') { exit 1 }
          $completion = & artifacts/PcNinja-Win11-Upgrade-Assistant-RC4.exe completion powershell | Out-String
          [scriptblock]::Create($completion) | Out-Null

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PcNinja-Win11-Upgrade-Assistant-RC4
          path: |
            artifacts/PcNinja-Win11-Upgrade-Assistant-RC4.exe
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: PcNinja Windows 11 Upgrade Assistant RC4
          body_path: docs/RELEASE-RC4.md
          files: |
            artifacts/PcNinja-Win11-Upgrade-Assistant-RC4.exe
            artifacts/SHA256SUMS.txt
