name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Resolve and verify release identity
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          [xml]$project = Get-Content src/PcNinja.Win11UpgradeAssistant/PcNinja.Win11UpgradeAssistant.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $rc = [regex]::Match($version, '^(\d+\.\d+\.\d+)-rc\.(\d+)$')
          if (-not $rc.Success) { throw 'This workflow requires an explicit RC version.' }
          if ($env:IS_TAG -eq 'true') {
            if ($env:REF_NAME -ne "v$version") { throw 'Release tag and product version differ.' }
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Only reviewed commits already merged into main may be released.' }
          }
          $label = 'RC' + $rc.Groups[2].Value
          $notes = "docs/RELEASE-$label.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Version-specific release notes are missing.' }
          "PRODUCT_VERSION=$version" >> $env:GITHUB_ENV
          "RC_LABEL=$label" >> $env:GITHUB_ENV
          "ASSET_NAME=Windows-Upgrade-Assistant-By-PcNinja.exe" >> $env:GITHUB_ENV
          "RELEASE_NOTES=$notes" >> $env:GITHUB_ENV

      - name: Run Core smoke tests
        shell: pwsh
        run: |
          dotnet run --project tests/PcNinja.Win11Upgrade.SmokeTests/PcNinja.Win11Upgrade.SmokeTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build GUI checks and run on supported Windows clients
        shell: pwsh
        run: |
          dotnet build tests/PcNinja.Win11Upgrade.GuiChecks/PcNinja.Win11Upgrade.GuiChecks.csproj -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-CimInstance Win32_OperatingSystem).ProductType -eq 1) {
            dotnet run --no-build --project tests/PcNinja.Win11Upgrade.GuiChecks/PcNinja.Win11Upgrade.GuiChecks.csproj -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Output 'Hosted Windows Server: GUI checks compile here; run client interaction checks locally on Windows 10/11.'
          }

      - name: Publish portable EXE
        shell: pwsh
        run: |
          dotnet publish src/PcNinja.Win11UpgradeAssistant/PcNinja.Win11UpgradeAssistant.csproj -c Release -r win-x64 --self-contained true -o artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Headless CLI automation result fixtures (no Setup)
        shell: pwsh
        run: |
          dotnet build tests/PcNinja.Win11Upgrade.CliChecks/PcNinja.Win11Upgrade.CliChecks.csproj -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/PcNinja.Win11Upgrade.CliChecks/PcNinja.Win11Upgrade.CliChecks.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare and verify release assets
        shell: pwsh
        run: |
          $exe = Join-Path artifacts $env:ASSET_NAME
          & ./tests/Verify-Cli.ps1 -ExePath $exe -ExpectedVersion $env:PRODUCT_VERSION
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ASSET_NAME" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
          @("Version: $env:PRODUCT_VERSION", "Commit: $env:GITHUB_SHA", "EXE bytes: $((Get-Item $exe).Length)", "SHA-256: $hash") |
            Set-Content artifacts/BUILD-INFO.txt -Encoding utf8
          Get-Content artifacts/BUILD-INFO.txt | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PcNinja-Win11-Upgrade-Assistant-${{ env.RC_LABEL }}
          if-no-files-found: error
          path: |
            artifacts/${{ env.ASSET_NAME }}
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: true
          name: Windows Upgrade Assistant By PcNinja ${{ env.RC_LABEL }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: |
            artifacts/${{ env.ASSET_NAME }}
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
